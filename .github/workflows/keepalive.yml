name: Supabase keep-alive (Multi-Project)

on:
  schedule:
    - cron: "17 6 */3 * *"      # Runs every 3 days
  workflow_dispatch: {}

jobs:
  ping-all:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping All Supabase Projects
        env:
          PROJECTS_JSON: ${{ secrets.SUPABASE_PROJECTS }}
        run: |
          set -eu
          if [ -z "${PROJECTS_JSON:-}" ]; then
            echo "Missing secret: SUPABASE_PROJECTS"; exit 1
          fi

          echo "$PROJECTS_JSON" | jq -c '.[]' | while read -r project; do
            name=$(echo "$project" | jq -r '.name')
            url=$(echo "$project" | jq -r '.url')
            key=$(echo "$project" | jq -r '.key')

            base="${url%/}"
            echo "----------------------------------------"
            echo "Pinging: $name ($base)"

            for i in 1 2 3; do
              code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 30 \
                -X POST "$base/rest/v1/rpc/get_public_settings" \
                -H "apikey: $key" -H "Authorization: Bearer $key" \
                -H "Content-Type: application/json" -d '{}')

              echo "  [$name] request $i -> HTTP $code"
              if [ "$code" != "200" ]; then
                cat /tmp/out.json
                echo ""
                exit 1
              fi
              sleep 2
            done
            echo "  [$name] Responded OK."
          done
          echo "----------------------------------------"
          echo "All Supabase projects pinged successfully."
