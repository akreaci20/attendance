# Keeps a FREE Supabase project from being paused for inactivity.
# Every 3 days it makes real requests to the database (it reads the public settings table).
# Needs two repository secrets: SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY
# (GitHub: Settings > Secrets and variables > Actions > New repository secret).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"     # 06:17 UTC on days 1, 4, 7, ... of each month
  workflow_dispatch: {}          # also lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -eu
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "Missing repository secrets SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY"; exit 1
          fi
          base="${SUPABASE_URL%/}"
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 30 \
              -X POST "$base/rest/v1/rpc/get_public_settings" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" -d '{}')
            echo "request $i -> HTTP $code"
            if [ "$code" != "200" ]; then cat /tmp/out.json; echo; exit 1; fi
            sleep 3
          done
          echo "Supabase responded OK."
